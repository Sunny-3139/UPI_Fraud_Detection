<form action="/predict" method="POST">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <input type="text" name="upi_number" placeholder="Enter UPI number">
        <input type="date" name="dob" placeholder="Enter date of Birth">
        <input type="text" name="holder_name" placeholder="UPI holder name">
        <input type="text" name="pin_code" placeholder="Enter pin code">
        
        <select name="state">
            <option value="">Select state</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Delhi">Delhi</option>
            <option value="Punjab">Punjab</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Kerala">Kerala</option>
            <option value="Telangana">Telangana</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Pune">Pune</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Lucknow">Lucknow</option>
            <option value="Jaipur">Jaipur</option>
            <option value="Chandigarh">Chandigarh</option>
            <option value="Ahmedabad">Ahmedabad</option>
            <option value="Surat">Surat</option>
            <option value="Indore">Indore</option>
            <option value="Bhopal">Bhopal</option>
            <option value="Vadodara">Vadodara</option>
            <option value="Gurgaon">Gurgaon</option>
            <option value="Kolkata">Kolkata</option>
            <option value="Kanpur">Kanpur</option>
        </select>
        
        <input type="number" name="amount" placeholder="Enter transaction amount (Rs)">
        <input type="datetime-local" name="trans_time" placeholder="Enter date and time of transaction">
        
        <select name="merchant_category">
            <option value="">Select merchant category</option>
            <option value="Shopping">Shopping</option>
            <option value="Cash Out / Transfer">Cash Out / Transfer</option>
            <option value="Food & Dining">Food & Dining</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Travel">Travel</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Groceries">Groceries</option>
            <option value="Bills & Utilities">Bills & Utilities</option>
            <option value="Fuel">Fuel</option>
            <option value="Education">Education</option>
            <option value="Online Services">Online Services</option>
            <option value="Insurance">Insurance</option>
        </select>
        
        <input type="text" name="seller_name" placeholder="Enter Seller name">
    </div>
    <button type="submit" style="background: linear-gradient(to right, #ff7e5f, #feb47b);">Click to Detect</button>
</form>
